# Gated E2E job — separate from ci.yml so it can path-filter on the surfaces
# that actually affect browser behaviour (a per-job `if:` in ci.yml can't read
# changed paths). Distinct concurrency group so an e2e run never cross-cancels
# the main ci.yml lint/type/test jobs on the same ref.
name: e2e

on:
  pull_request:
    paths:
      - "app/nbio/static/**"
      - "app/nbio/routes/**"
      - "app/nbio/templates/**"
      - "e2e/**"
      - "docker-compose.e2e.yml"
      - ".github/workflows/e2e.yml"
  # Also run post-merge on master (catches breakage a path-filtered PR let
  # through) and on demand. Same path filter keeps cost down on unrelated pushes.
  push:
    branches: [master]
    paths:
      - "app/nbio/static/**"
      - "app/nbio/routes/**"
      - "app/nbio/templates/**"
      - "e2e/**"
      - "docker-compose.e2e.yml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Hard ceiling: a wedged `docker compose up` (stalled pull, boot-loop, or an
    # EventSource that never errors) must not burn the runner budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run containerized Playwright E2E
        run: >
          docker compose -f docker-compose.e2e.yml up
          --build --abort-on-container-exit --exit-code-from e2e

      - name: Copy Playwright report out of the container
        if: failure()
        run: |
          docker compose -f docker-compose.e2e.yml cp e2e:/work/playwright-report ./playwright-report || true
          docker compose -f docker-compose.e2e.yml cp e2e:/work/test-results ./test-results || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
